name: Publish image

# Issue #53: publishes the container image of the front-end to the GitHub Container Registry (ghcr.io) when a version tag
# (v*) is pushed, the same way the back-end does. Nothing is published from a branch or a pull request, and the image is
# never published from a build that failed or from an image that does not pass the smoke test.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The same checks as the CI. The publishing job only starts if this one passes.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that can write packages. The GITHUB_TOKEN is enough: no secret was added to the repository.
    permissions:
      contents: read
      packages: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, to check that the tagged commit is on main.
          fetch-depth: 0

      # Only reviewed code is published: the tag must look like v1.0.0 (or v1.0.0-rc.1) and point to a commit
      # that is already on main.
      - name: Check the tag
        run: |
          if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::The tag '$TAG_NAME' is not a version (expected v1.0.0 or v1.0.0-rc.1)."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The commit of '$TAG_NAME' is not on main."
            exit 1
          fi

      # Two tags, and no "latest": the version (the tag without the "v") and the short hash of the commit. A
      # deployment names one of them, so what runs is always known. The owner is lowercased (a registry rule).
      - name: Name the image
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/booksmanager-web" >> "$GITHUB_ENV"
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # The checks ran in the job above, so the image build does not repeat them (see the Dockerfile).
      - name: Build the image
        run: |
          docker build \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$COMMIT" \
            .

      # What is published has been tried: the image must serve what the production setup depends on.
      - name: Smoke test the image
        run: scripts/smoke-image.sh "$IMAGE:$VERSION"

      # Only warns, in the first versions: a finding is shown in the log and does not stop the publication.
      - name: Scan the image for vulnerabilities
        continue-on-error: true
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 image --severity HIGH,CRITICAL --exit-code 0 "$IMAGE:$VERSION"

      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the image
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$COMMIT"
          {
            echo "### Image published"
            echo
            echo "- \`$IMAGE:$VERSION\`"
            echo "- \`$IMAGE:$COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"
