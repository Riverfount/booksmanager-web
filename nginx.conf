# The Nginx of the front-end image: it serves the static build of the single-page app and nothing else. The proxy in
# front of it (the production Nginx of the back-end) ends the TLS, sets the security headers (HSTS, nosniff,
# X-Frame-Options, Referrer-Policy) and sends /api/ to the API, so none of that is repeated here: the browser would
# get each header twice.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not say which version of Nginx this is.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # For the HEALTHCHECK and for the orchestration: a static answer, kept out of the access log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API is not here. The proxy in front sends /api/ elsewhere; if a request for it ever arrives, it is a
    # misrouting, and it must be a plain 404, not the page of the app answering where JSON was expected.
    location /api/ {
        return 404;
    }

    # The files of the build have hashed names, so they never change under the same name: cache them for a year.
    # A file that is not there is a real 404 (a stale bundle must fail loudly, not load index.html as JavaScript).
    # The header has no "always": a 404 is not cached as immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry page is never cached, so a new deployment is seen at once (and it points at the new hashed files).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: a reload on /livros or /convite?token=... returns the app, which reads the address itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
